[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot_robot_piper"
version = "0.1.0"
description = "LeRobot plugin for the AgileX Piper robot arm — safe startup, smooth home/rest, deg/rad units, MIT impedance mode"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "charlie8612" }]
keywords = ["lerobot", "robotics", "piper", "agilex", "imitation-learning", "teleoperation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Piper SDK is vendored at ../vendor/piper_sdk (version 1.0.0).
# Do not add piper-sdk here; pip would fetch PyPI instead of the local copy.
# New machines should run: ./install_on_new_pc.sh
dependencies = [
    "lerobot>=0.4.0",
    "numpy>=1.21",
    "pyserial>=3.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "mypy>=1.0",
    "ruff>=0.1",
    "bandit>=1.7",
]

[project.urls]
Homepage = "https://github.com/charlie8612/lerobot_robot_piper"
Repository = "https://github.com/charlie8612/lerobot_robot_piper"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
ignore_missing_imports = true
disable_error_code = ["import-untyped"]
